# Render Blueprint (FREE plan, demo setup): the API service.
# The database is an EXTERNAL free Postgres (Neon, see README), so Render only asks for ONE value: DB_URL.
# New > Blueprint > pick this repo > paste DB_URL > Apply. Everything else is preset or generated.
#
# Demo setup: uploaded images/videos are kept IN the database (PUBLIC_DISK_DRIVER=database) and served by this API
# at /media/..., so no bucket / cloud storage is needed. For real traffic switch to PUBLIC_DISK_DRIVER=s3 (see README).
# Free-tier note: the web service sleeps after ~15 min idle (first request takes 30-60 s).
services:
  - type: web
    name: nonstop-backend
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Non Stop
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY_SEED          # the container derives a stable APP_KEY from this
        generateValue: true
      # APP_URL defaults to the service's own address (RENDER_EXTERNAL_URL) when not set
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false                # your Neon connection string (direct, not pooled), ending in ?sslmode=require
      - key: DB_SSLMODE
        value: require
      - key: FRONTEND_URL          # CORS: "*" is fine for a public read-only demo API; list your Vercel domain(s) later
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: array
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "true"              # loads the demo content + images + reels only if the database is empty
      - key: PUBLIC_DISK_DRIVER
        value: database
      - key: MAIL_MAILER           # demo: enquiry emails are written to the log; set SMTP details for real email
        value: log
