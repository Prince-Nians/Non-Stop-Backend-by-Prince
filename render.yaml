# Render Blueprint (FREE plan, demo setup): Postgres database + the API service.
# New > Blueprint > pick this repo > Apply. No values are asked for: everything below is preset or generated.
#
# Demo setup: uploaded images/videos are kept IN the database (PUBLIC_DISK_DRIVER=database) and served by this API
# at /media/..., so no bucket / cloud storage is needed. For real traffic switch to PUBLIC_DISK_DRIVER=s3 (see README).
# Free-tier notes: the web service sleeps after ~15 min idle (first request takes 30-60 s) and the free Postgres
# is deleted after 30 days.
databases:
  - name: nonstop-db
    plan: free
    databaseName: nonstop
    user: nonstop

services:
  - type: web
    name: nonstop-backend
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Non Stop
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY_SEED          # the container derives a stable APP_KEY from this
        generateValue: true
      # APP_URL defaults to the service's own address (RENDER_EXTERNAL_URL) when not set
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: nonstop-db
          property: connectionString
      - key: FRONTEND_URL          # CORS: "*" is fine for a public read-only demo API; list your Vercel domain(s) later
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: array
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "true"              # loads the demo content + images + reels only if the database is empty
      - key: PUBLIC_DISK_DRIVER
        value: database
      - key: MAIL_MAILER           # demo: enquiry emails are written to the log; set SMTP details for real email
        value: log
